<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Neyria：平台托管模型的 AI 创作工作台</title>
  <desc id="hero-desc">Neyria 提供流式对话、RAG 问答、可编辑 Workflow 与订阅计费；右侧为聊天助手经歌词 Block、图像 Block 到资产入库的生产链路。</desc>

  <rect width="1200" height="360" rx="24" fill="#0A0A0C"/>

  <g id="title-block">
    <text x="56" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="20" fill="#8A8A93">AI 创作工作台 · 平台托管模型</text>
    <text x="56" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="76" font-weight="700" fill="#F4F4F4">Neyria</text>
    <text x="56" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="23" fill="#C9CDD6">流式对话 · RAG 问答 · 可编辑 Workflow</text>
    <text x="56" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="23" fill="#C9CDD6">订阅计费 · 用量可解释</text>
    <text x="56" y="312" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16" fill="#6F6F76">FastAPI · Vue 3 · SQLite · Redis · ChromaDB</text>
  </g>

  <g id="workflow-proof">
    <rect x="672" y="36" width="472" height="292" rx="14" fill="#0D0D11" stroke="#1B1B22" stroke-width="1"/>

    <!-- edges -->
    <path d="M 890 83 C 926 83, 916 153, 952 153" fill="none" stroke="#60A5FA" stroke-width="2"/>
    <path d="M 1047 182 C 1047 210, 913 195, 890 223" fill="none" stroke="#60A5FA" stroke-width="2"/>
    <path d="M 890 223 C 926 223, 916 293, 952 293" fill="none" stroke="#60A5FA" stroke-width="2"/>

    <!-- nodes -->
    <g id="node-chat">
      <rect x="700" y="54" width="190" height="58" rx="10" fill="#131318" stroke="#2E2E38" stroke-width="1.5"/>
      <text x="795" y="79" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
            font-size="20" font-weight="600" fill="#E8E8EC">Chat 助手</text>
      <text x="795" y="100" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="16" fill="#77777F">ReAct 多轮</text>
    </g>
    <g id="node-lyrics">
      <rect x="952" y="124" width="190" height="58" rx="10" fill="#131318" stroke="#2E2E38" stroke-width="1.5"/>
      <text x="1047" y="149" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
            font-size="20" font-weight="600" fill="#E8E8EC">歌词 Block</text>
      <text x="1047" y="170" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="16" fill="#77777F">glm-4-flash</text>
    </g>
    <g id="node-image">
      <rect x="700" y="194" width="190" height="58" rx="10" fill="#131318" stroke="#2E2E38" stroke-width="1.5"/>
      <text x="795" y="219" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
            font-size="20" font-weight="600" fill="#E8E8EC">图像 Block</text>
      <text x="795" y="240" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="16" fill="#77777F">Kwai-Kolors</text>
    </g>
    <g id="node-asset">
      <rect x="952" y="264" width="190" height="58" rx="10" fill="#131318" stroke="#60A5FA" stroke-width="1.5"/>
      <text x="1047" y="289" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
            font-size="20" font-weight="600" fill="#E8E8EC">资产入库</text>
      <text x="1047" y="310" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="16" fill="#77777F">1344×768 PNG</text>
    </g>

    <!-- ports -->
    <circle cx="890" cy="83" r="4.5" fill="#0A0A0C" stroke="#60A5FA" stroke-width="1.5"/>
    <circle cx="952" cy="153" r="4.5" fill="#0A0A0C" stroke="#60A5FA" stroke-width="1.5"/>
    <circle cx="1047" cy="182" r="4.5" fill="#0A0A0C" stroke="#60A5FA" stroke-width="1.5"/>
    <circle cx="890" cy="223" r="4.5" fill="#0A0A0C" stroke="#60A5FA" stroke-width="1.5"/>
    <circle cx="952" cy="293" r="4.5" fill="#0A0A0C" stroke="#60A5FA" stroke-width="1.5"/>
  </g>
</svg>
