<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="560" viewBox="0 0 1200 560"
     role="img" aria-labelledby="how-title how-desc">
  <title id="how-title">Neyria 架构分层</title>
  <desc id="how-desc">前端工作台调用 FastAPI 后端；后端由 ReAct 编排器、Capability Runtime、注入防护与任务队列组成，向下依赖计费账本、存储与模型 Provider。</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60A5FA"/>
    </marker>
  </defs>

  <rect width="1200" height="560" rx="24" fill="#0A0A0C"/>

  <g id="tier-frontend">
    <rect x="56" y="44" width="1088" height="60" rx="10" fill="#131318" stroke="#2E2E38" stroke-width="1.5"/>
    <text x="80" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="22" font-weight="600" fill="#E8E8EC">Vue 3 工作台</text>
    <text x="1120" y="82" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" fill="#8A8A93">对话 · Block 面板 · Workflow 画布</text>
  </g>

  <g id="arrows-1" stroke="#60A5FA" stroke-width="2" opacity="0.85">
    <line x1="182.5" y1="104" x2="182.5" y2="158" marker-end="url(#arr)"/>
    <line x1="459.5" y1="104" x2="459.5" y2="158" marker-end="url(#arr)"/>
    <line x1="736.5" y1="104" x2="736.5" y2="158" marker-end="url(#arr)"/>
    <line x1="1013.5" y1="104" x2="1013.5" y2="158" marker-end="url(#arr)"/>
  </g>

  <g id="tier-backend">
    <g id="mod-orchestrator">
      <rect x="56" y="164" width="253" height="140" rx="10" fill="#131318" stroke="#2E2E38" stroke-width="1.5"/>
      <text x="182.5" y="216" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
            font-size="22" font-weight="600" fill="#E8E8EC">ReAct 编排器</text>
      <text x="182.5" y="252" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18" fill="#8A8A93">SSE 流式输出</text>
      <text x="182.5" y="282" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18" fill="#8A8A93">多轮工具调用</text>
    </g>
    <g id="mod-runtime">
      <rect x="333" y="164" width="253" height="140" rx="10" fill="#131318" stroke="#2E2E38" stroke-width="1.5"/>
      <text x="459.5" y="216" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
            font-size="21" font-weight="600" fill="#E8E8EC">Capability Runtime</text>
      <text x="459.5" y="252" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18" fill="#8A8A93">歌词 · 图像 · 检索</text>
      <text x="459.5" y="282" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18" fill="#8A8A93">密钥平台托管</text>
    </g>
    <g id="mod-guard">
      <rect x="610" y="164" width="253" height="140" rx="10" fill="#131318" stroke="#2E2E38" stroke-width="1.5"/>
      <text x="736.5" y="216" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
            font-size="22" font-weight="600" fill="#E8E8EC">注入防护</text>
      <text x="736.5" y="252" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18" fill="#8A8A93">规则 + 语义双层</text>
      <text x="736.5" y="282" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18" fill="#8A8A93">间接注入冻结工具</text>
    </g>
    <g id="mod-queue">
      <rect x="887" y="164" width="253" height="140" rx="10" fill="#131318" stroke="#2E2E38" stroke-width="1.5"/>
      <text x="1013.5" y="216" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
            font-size="22" font-weight="600" fill="#E8E8EC">任务队列 Worker</text>
      <text x="1013.5" y="252" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18" fill="#8A8A93">持久化 jobs</text>
      <text x="1013.5" y="282" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18" fill="#8A8A93">租约恢复 · 重试</text>
    </g>
  </g>

  <g id="arrows-2" stroke="#60A5FA" stroke-width="2" opacity="0.85">
    <line x1="231" y1="304" x2="231" y2="358" marker-end="url(#arr)"/>
    <line x1="600" y1="304" x2="600" y2="358" marker-end="url(#arr)"/>
    <line x1="969" y1="304" x2="969" y2="358" marker-end="url(#arr)"/>
  </g>

  <g id="tier-foundation">
    <g id="mod-billing">
      <rect x="56" y="364" width="350" height="92" rx="10" fill="#131318" stroke="#2E2E38" stroke-width="1.5"/>
      <text x="231" y="406" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
            font-size="22" font-weight="600" fill="#E8E8EC">计费账本</text>
      <text x="231" y="438" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18" fill="#8A8A93">预占 · 结算 · 幂等充值</text>
    </g>
    <g id="mod-storage">
      <rect x="425" y="364" width="350" height="92" rx="10" fill="#131318" stroke="#2E2E38" stroke-width="1.5"/>
      <text x="600" y="406" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
            font-size="22" font-weight="600" fill="#E8E8EC">存储</text>
      <text x="600" y="438" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18" fill="#8A8A93">SQLite WAL · Redis · ChromaDB</text>
    </g>
    <g id="mod-providers">
      <rect x="794" y="364" width="350" height="92" rx="10" fill="#131318" stroke="#2E2E38" stroke-width="1.5" stroke-dasharray="6 4"/>
      <text x="969" y="406" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
            font-size="22" font-weight="600" fill="#E8E8EC">Provider（外部）</text>
      <text x="969" y="438" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18" fill="#8A8A93">智谱 GLM · SiliconFlow</text>
    </g>
  </g>

  <text x="600" y="512" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="18" fill="#8A8A93">Chat Assistant、直接使用与 Workflow 节点共用同一 Capability Runtime</text>
</svg>
